name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_release.yml@a01969bc5af90666281f9d37acffdf6a4629763a
    with:
      pypi_python_version: "3.11"
      pypi_build_linux: true
      pypi_build_macos: true
      pypi_build_windows: true
      conda_python_versions: '["3.14"]'
      conda_os_list: '["ubuntu-latest"]'
      conda_package_name: typedunit
      conda_recipe_path: conda.recipe
      conda_test_import: TypedUnit
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
