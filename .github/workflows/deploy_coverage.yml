name: Publish coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: typedunit-coverage
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_coverage.yml@a01969bc5af90666281f9d37acffdf6a4629763a
    with:
      python-version: "3.11"
      apt-package: xvfb
      coverage-package: TypedUnit
    secrets:
      _GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
