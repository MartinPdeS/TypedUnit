[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TypedUnit"
version = "0.2.16"
description = "A package wrapping pint for handling typed units in Python."
license = {file = "LICENSE"}
readme = "README.rst"
requires-python = ">=3.10"
authors = [{ name="Martin Poinsinet de Sivry-Houle", email="martin.poinsinet.de.sivry@gmail.com"}]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: Implementation :: CPython',
    'Development Status :: 4 - Beta',
    'Topic :: Scientific/Engineering :: Physics',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Science/Research',
]

keywords = [
    "typed units",
    "pint",
    "physical quantities"
]

dependencies = [
    "pint>=0.24,<0.26",
    'numpy',
    'matplotlib',
    'pint_pandas'
]

[project.urls]
Homepage = "https://github.com/MartinPdeS/TypedUnit"
Documentation = "https://martinpdes.github.io/TypedUnit/"
Repository = "https://github.com/MartinPdeS/TypedUnit.git"

[project.optional-dependencies]
release = ["martinpdes-maintenance==0.2.2"]
testing = [
    "pytest >=7.4,<10.0",
    "pytest-cov >=2,<7",
    "pytest-json-report ~=1.5",
    "flake8 ==7.3.0",
    "coverage ~=7.6"
]

documentation = [
    "MartinPdeS-docs>=0.2.5,<0.3",
]

[tool.ruff]
target-version = "py310"
# The release helper maintains the version file.
extend-exclude = ["TypedUnit/_version.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mps-maintenance]
version-file = "TypedUnit/_version.py"
version-method = "literal"
conda-recipe = "conda.recipe/meta.yaml"
